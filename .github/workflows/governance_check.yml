name: Governance & Quality Review

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  static-checks:
    name: 1. الفحص الساكن والتجميع
    runs-on: ubuntu-latest
    steps:
      - name: جلب الكود
        uses: actions/checkout@v4

      - name: إعداد بيئة Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: تثبيت التبعيات
        run: npm ci

      - name: فحص معايير الكود والأنواع (Type Check)
        run: npm run lint

      - name: فحص أخطاء البناء والتجميع (Build Check)
        run: npm run build

  ai-governance-audit:
    name: 2. تدقيق الذكاء الاصطناعي بموجب الوثيقة الحاكمة
    needs: static-checks
    runs-on: ubuntu-latest
    steps:
      - name: جلب الكود مع تاريخ التعديلات
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: إعداد بيئة Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: تثبيت التبعيات
        run: npm ci

      - name: استخراج التغييرات البرمجية وتمريرها للفحص الحاكم
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/ai_audit.js
